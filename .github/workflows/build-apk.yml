name: Build & Release AuraStream Mobile APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Build Android APK
        run: |
          cd aurastream-mobile
          gradle assembleDebug --stacktrace

      - name: Build Spring Boot Backend JAR
        run: |
          cd aurastream-backend
          mvn clean package -DskipTests

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: AuraStream Release v1.0.0
          overwrite: true
          body: |
            ## AuraStream Mobile - Smart Audio Streaming System v1.0.0 🎵🚀
            
            ### Included Deliverables:
            - **aurastream-mobile.apk**: Native Android App (Kotlin, Jetpack Compose, Media3/ExoPlayer).
            - **aurastream-backend.jar**: Spring Boot 3.2 HTTP Byte-Range Audio Streaming & Playlist REST Server.
          files: |
            aurastream-mobile/app/build/outputs/apk/debug/*.apk
            aurastream-backend/target/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
